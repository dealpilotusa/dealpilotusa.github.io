<style>
/* ============ RESET & TOKENS ============ */
:root{
  --accent:#e8632a;--accent-h:#c44f1c;--accent-soft:rgba(232,99,42,.10);--accent-line:rgba(232,99,42,.28);
  --bg:#fbfaf8;--bg2:#f5f2ee;--surface:#ffffff;--surface2:#f9f7f4;
  --text:#181512;--text2:#5c5651;--text3:#8f8880;
  --line:#ebe6e0;--line2:#ddd6cd;
  --green:#0f9d58;--red:#d33a3a;--blue:#2a6fd1;--yellow:#b58900;
  --radius-sm:8px;--radius:12px;--radius-lg:18px;--radius-xl:24px;
  --shadow-sm:0 1px 2px rgba(24,21,18,.04);
  --shadow:0 4px 14px -4px rgba(24,21,18,.08);
  --shadow-lg:0 24px 48px -20px rgba(24,21,18,.15);
  --shadow-xl:0 32px 60px -24px rgba(24,21,18,.22);
  color-scheme:light;
  --trans:.22s cubic-bezier(.4,0,.2,1);
}
[data-theme=dark]{
  --bg:#0f0e0d;--bg2:#151311;--surface:#1a1817;--surface2:#211e1c;
  --text:#f5f2ee;--text2:#a39c95;--text3:#6d6660;
  --line:#2a2724;--line2:#37332f;
  --accent-soft:rgba(232,99,42,.14);--accent-line:rgba(232,99,42,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 14px -4px rgba(0,0,0,.4);
  --shadow-lg:0 24px 48px -20px rgba(0,0,0,.55);
  --shadow-xl:0 32px 60px -24px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;font-family:inherit}
input,select,textarea{font:inherit;color:inherit;font-family:inherit}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft);color:var(--accent)}

/* ============ TYPOGRAPHY ============ */
h1,h2,h3,h4{font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-.022em;line-height:1.15;color:var(--text)}
h1{font-size:clamp(2rem,5vw,3.75rem);font-weight:800}
h2{font-size:clamp(1.4rem,3vw,1.85rem);font-weight:700}
h3{font-size:1.05rem}
.mono{font-variant-numeric:tabular-nums}

/* ============ LAYOUT ============ */
.container{max-width:1200px;margin:0 auto;padding:0 24px}
main{min-height:60vh}

/* ============ HEADER ============ */
header.top{position:sticky;top:0;z-index:100;background:rgba(251,250,248,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);transition:background .3s}
[data-theme=dark] header.top{background:rgba(15,14,13,.85)}
.top-in{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:'Manrope',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:-.03em;color:var(--text)}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#b8451a);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem;box-shadow:0 4px 12px -2px rgba(232,99,42,.4);font-family:'Manrope',sans-serif}
.nav{display:flex;gap:2px;margin-left:12px;flex-wrap:wrap}
.nav a{padding:8px 14px;border-radius:8px;font-size:.88rem;font-weight:500;color:var(--text2);transition:var(--trans);white-space:nowrap}
.nav a:hover{background:var(--surface2);color:var(--text)}
.nav a.on{background:var(--text);color:var(--bg)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--text2);transition:var(--trans);font-size:.95rem;cursor:pointer}
.icon-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--line2)}
.region-sel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.82rem;font-weight:500;color:var(--text);cursor:pointer;transition:var(--trans);appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%238f8880' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}
.region-sel:hover{border-color:var(--line2)}

/* ============ BUTTONS ============ */
.btn{background:var(--text);color:var(--bg);border-radius:10px;padding:12px 22px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;transition:var(--trans);cursor:pointer;border:1.5px solid transparent;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn.accent{background:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-h)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2);border-color:var(--line2)}
.btn.sm{padding:9px 16px;font-size:.85rem}
.btn.lg{padding:15px 28px;font-size:.98rem;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* ============ HERO ============ */
.hero{padding:80px 0 64px;text-align:center;position:relative}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 800px 400px at 50% 0%,var(--accent-soft),transparent 70%);pointer-events:none;z-index:-1}
.hero h1{margin-bottom:20px;max-width:820px;margin-left:auto;margin-right:auto;letter-spacing:-.035em}
.hero h1 .em{color:var(--accent);font-style:normal}
.hero .sub{font-size:1.1rem;color:var(--text2);max-width:560px;margin:0 auto 36px;line-height:1.6}

/* Search */
.search-wrap{max-width:640px;margin:0 auto 20px}
.search-box{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;display:flex;align-items:center;padding:6px 6px 6px 18px;transition:var(--trans);box-shadow:var(--shadow)}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-lg)}
.search-box svg{flex-shrink:0;color:var(--text3)}
.search-box input{flex:1;border:0;outline:0;background:transparent;padding:14px 12px;font-size:1rem;color:var(--text);min-width:0}
.search-box input::placeholder{color:var(--text3)}
.search-box .btn{padding:12px 22px}

.search-examples{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.example-chip{background:var(--surface);border:1px solid var(--line);padding:7px 14px;border-radius:100px;font-size:.82rem;font-weight:500;color:var(--text2);transition:var(--trans);cursor:pointer}
.example-chip:hover{background:var(--surface2);border-color:var(--line2);color:var(--text)}

.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* ============ SECTIONS ============ */
.sec{margin:80px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-head h2{letter-spacing:-.028em}
.sec-head p{color:var(--text2);font-size:.95rem;margin-top:6px}
.sec-head .more{color:var(--accent);font-weight:600;font-size:.88rem;transition:var(--trans);white-space:nowrap}
.sec-head .more:hover{color:var(--accent-h)}
.sec-head .more::after{content:' →';transition:var(--trans)}
.sec-head .more:hover::after{transform:translateX(2px)}

/* ============ PURPOSE CARDS ============ */
.purpose-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.purpose-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px 20px;transition:var(--trans);cursor:pointer;text-align:left;position:relative;overflow:hidden}
.purpose-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent-soft),transparent 60%);opacity:0;transition:var(--trans);pointer-events:none}
.purpose-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--line2)}
.purpose-card:hover::after{opacity:1}
.purpose-card .ico{font-size:1.75rem;margin-bottom:14px;line-height:1;position:relative;z-index:1}
.purpose-card b{display:block;font-family:'Manrope',sans-serif;font-weight:700;font-size:1rem;margin-bottom:4px;letter-spacing:-.015em;position:relative;z-index:1}
.purpose-card small{color:var(--text3);font-size:.82rem;line-height:1.5;position:relative;z-index:1}

/* ============ TOOL CARDS ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tool-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;gap:14px;align-items:flex-start;transition:var(--trans);cursor:pointer;position:relative;min-height:92px}
.tool-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line2)}
.tool-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:var(--accent);font-size:0}
.tool-icon.t-money{background:linear-gradient(135deg,#e8632a,#b8451a)}
.tool-icon.t-shopping{background:linear-gradient(135deg,#c9468c,#8f2e64)}
.tool-icon.t-finance{background:linear-gradient(135deg,#2a6fd1,#1a4b96)}
.tool-icon.t-conv{background:linear-gradient(135deg,#0f9d58,#0a6b3c)}
.tool-icon.t-time{background:linear-gradient(135deg,#7a5af0,#543dc7)}
.tool-icon.t-travel{background:linear-gradient(135deg,#0fa4a4,#0a7070)}
.tool-icon.t-health{background:linear-gradient(135deg,#d33a3a,#8f2626)}
.tool-icon.t-every{background:linear-gradient(135deg,#b58900,#7d5f00)}
.tool-body{flex:1;min-width:0}
.tool-body b{display:block;font-family:'Manrope',sans-serif;font-weight:600;font-size:.95rem;line-height:1.3;margin-bottom:3px;color:var(--text);letter-spacing:-.01em}
.tool-body small{display:block;color:var(--text3);font-size:.82rem;line-height:1.45;font-weight:400}
.tool-arrow{color:var(--text3);font-size:1rem;align-self:center;transition:var(--trans);flex-shrink:0;opacity:.6}
.tool-card:hover .tool-arrow{color:var(--accent);opacity:1;transform:translateX(3px)}
.tool-star{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:transparent;color:var(--text3);font-size:.9rem;transition:var(--trans);z-index:2;opacity:0}
.tool-card:hover .tool-star,.tool-star.on{opacity:1}
.tool-star:hover{background:var(--surface2);color:var(--text)}
.tool-star.on{color:var(--accent)}

/* ============ CATEGORY TABS ============ */
.cats-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.cats-row::-webkit-scrollbar{display:none}
.cat-chip{padding:8px 16px;border-radius:100px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:500;color:var(--text2);transition:var(--trans);white-space:nowrap;cursor:pointer}
.cat-chip:hover{border-color:var(--line2);color:var(--text)}
.cat-chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ============ CARDS ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;margin:20px 0;box-shadow:var(--shadow-sm)}

/* ============ FORM ============ */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
label{display:block}
label>span{display:block;font-size:.78rem;font-weight:600;color:var(--text2);margin-bottom:8px;letter-spacing:.005em}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:.95rem;transition:var(--trans);outline:0;font-variant-numeric:tabular-nums}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.full{grid-column:1/-1}
.tip{grid-column:1/-1;color:var(--text3);font-size:.8rem;padding:10px 14px;background:var(--surface2);border-radius:10px;border-left:2px solid var(--accent)}

/* ============ RESULT ============ */
.result-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;margin-top:24px;box-shadow:var(--shadow);animation:resultIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes resultIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.result-eyebrow{font-size:.72rem;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.result-main{font-family:'Manrope',sans-serif;font-size:clamp(2.4rem,6vw,3.4rem);font-weight:800;letter-spacing:-.04em;color:var(--accent);line-height:1.05;margin-bottom:22px;word-break:break-word;font-variant-numeric:tabular-nums}
.result-breakdown{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:0}
.result-row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.result-row:last-child{border-bottom:0}
.result-row span{color:var(--text2)}
.result-row b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text);text-align:right}
.result-row.hl b{color:var(--accent);font-size:1.05rem;font-weight:700}

.explain{margin-top:20px;padding:18px 20px;background:var(--surface2);border-radius:12px;border-left:3px solid var(--accent)}
.explain h4{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:10px}
.explain .math{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.88rem;color:var(--text2);line-height:2;white-space:pre-wrap;word-break:break-word}
.explain .plain{margin-top:10px;font-size:.9rem;color:var(--text2);line-height:1.6}

.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

.err{background:var(--red);color:#fff;padding:14px 18px;border-radius:10px;font-size:.9rem;margin-top:16px;font-weight:500}
.warn{background:rgba(181,137,0,.1);border:1px solid rgba(181,137,0,.3);color:var(--yellow);padding:14px 18px;border-radius:10px;font-size:.88rem;margin-top:16px}

/* ============ TOOL HERO ============ */
.tool-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:32px;margin-bottom:22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.tool-hero .tool-icon{width:64px;height:64px;border-radius:16px}
.tool-hero .tool-icon svg{width:30px;height:30px}
.tool-hero h1{font-size:1.55rem;margin-bottom:6px}
.tool-hero p{color:var(--text2);font-size:.95rem;line-height:1.55;max-width:560px}
.crumb{font-size:.8rem;color:var(--text3);font-weight:500;margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--text2);transition:var(--trans)}
.crumb a:hover{color:var(--accent)}

/* ============ RELATED ============ */
.related{margin-top:32px;padding-top:26px;border-top:1px solid var(--line)}
.related h3{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);margin-bottom:14px}

/* ============ FAQ ============ */
.faq{margin-top:32px}
.faq h2{font-size:1.15rem;margin-bottom:16px}
.faq-item{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface);overflow:hidden;transition:var(--trans)}
.faq-item:hover{border-color:var(--line2)}
.faq-item summary{padding:16px 20px;font-weight:600;font-size:.93rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:var(--trans)}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:'+';color:var(--text3);font-size:1.2rem;font-weight:400;transition:var(--trans);line-height:1}
.faq-item[open] summary::after{transform:rotate(45deg);color:var(--accent)}
.faq-item p{padding:0 20px 18px;color:var(--text2);font-size:.9rem;line-height:1.65}

/* ============ TRUST ============ */
.trust{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:36px}
.trust h2{text-align:center;margin-bottom:26px;font-size:1.25rem}
.trust-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px}
.trust-item{text-align:center}
.trust-item .ic{width:44px;height:44px;margin:0 auto 12px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-size:1.1rem;font-weight:700}
.trust-item b{display:block;font-size:.9rem;font-weight:600;margin-bottom:4px}
.trust-item small{color:var(--text3);font-size:.8rem;line-height:1.5;display:block}

/* ============ NEWS ============ */
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.news-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:var(--trans);display:flex;flex-direction:column}
.news-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line2)}
.news-card-img{width:100%;height:170px;object-fit:cover;display:block;background:var(--surface2)}
.news-card-body{padding:16px;flex:1;display:flex;flex-direction:column;gap:10px}
.news-card h3{font-size:.94rem;line-height:1.4;flex:1;font-weight:600;letter-spacing:-.01em}
.news-meta{display:flex;justify-content:space-between;color:var(--text3);font-size:.75rem;font-weight:500;gap:10px;flex-wrap:wrap}
.news-source{color:var(--accent);font-weight:600}
.news-featured{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:block;margin-bottom:20px;transition:var(--trans)}
.news-featured:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line2)}
.news-featured-img{width:100%;height:340px;object-fit:cover;display:block;background:var(--surface2)}
.news-featured-body{padding:28px}
.news-featured h2{font-size:1.35rem;line-height:1.35;margin:12px 0 12px}
.news-featured p{color:var(--text2);font-size:.92rem;line-height:1.6}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:100px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.refresh-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;padding:12px 18px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.refresh-bar .info{font-size:.82rem;color:var(--text3);display:flex;align-items:center;gap:8px;font-weight:500}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}

.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}

/* ============ TOAST ============ */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:12px;font-weight:600;font-size:.88rem;z-index:9999;box-shadow:var(--shadow-xl);animation:toastIn .3s}

.list-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}

function addMonths(d, n){ var t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+n, 1)); t.setUTCDate(Math.min(d.getUTCDate(), daysInMonth(t.getUTCFullYear(), t.getUTCMonth()))); return t; }
function ymdDiff(b, a){ var y = a.getUTCFullYear() - b.getUTCFullYear(); var m = a.getUTCMonth() - b.getUTCMonth(); var d = a.getUTCDate() - b.getUTCDate(); if (d < 0) { m--; d += daysInMonth(a.getUTCFullYear(), a.getUTCMonth()-1); } if (m < 0) { y--; m += 12; } return [y, m, d]; }
function todayISO(){ return new Date().toISOString().slice(0, 10); }
function parseLines(str){ return str.split('\n').map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){ return l.split(',').map(function(x){ return x.trim(); }); }); }
function allNums(rows, idx){ return rows.every(function(a){ return a.length > idx && a[idx] !== '' && isFinite(+a[idx]) && +a[idx] >= 0; }); }
function holidaySet(str){ var s = {}; (str || '').split(/[\s,;]+/).filter(function(x){ return /^\d{4}-\d\d-\d\d$/.test(x); }).forEach(function(x){ s[x] = 1; }); return s; }
function countBizDays(a, b, holSet){ var n = 0; for (var d = new Date(a), i = 0; d <= b && i < 40000; d = new Date(+d + 864e5), i++) { var w = d.getUTCDay(); if (w && w < 6 && !holSet[isoDate(d)]) n++; } return n; }

    cnt.textContent = items.length ? (open + ' open · ' + done + ' done') : 'Nothing here yet.';
  }

  }

function buildCalc(sci){
  return function(el){
    var inp = h('input', {type: 'text', placeholder: sci ? 'Try: sqrt(16)+sin(pi/2)*2^3' : 'Try: 12*(3+4)/2', autocomplete: 'off'});
    var out = h('div', {class: 'calc-display'}, '0');

    function run(){

      try { r = Function('"use strict";return (' + e + ')')(); } catch(err){ r = NaN; }
      if (typeof r !== 'number' || !isFinite(r)) { out.textContent = 'Cannot calculate'; return; }
      out.textContent = fmt(r, 10);

      while (hist.children.length > 8) hist.removeChild(hist.lastChild);
    }
    inp.onkeydown = function(e){ if (e.key === 'Enter') run(); };
    var keys = ['7','8','9','/','(','4','5','6','*',')','1','2','3','-','^','0','.','%','+','='];
    if (sci) keys = keys.concat(['sqrt(','sin(','cos(','tan(','log(','ln(','pi','abs(','exp(','round(']);
    var pad = h('div', {class: 'pad'});

  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';

/* ============================================================
   SMART SEARCH
   ============================================================ */
function smartRoute(query){
  var q = query.toLowerCase().trim();
  if (!q) return null;
  // Discount: "20% off $250"
  var m = q.match(/(\d+(?:\.\d+)?)\s*%\s*(?:off|discount)/);
  if (m) {
    var price = q.match(/\$?\s*(\d+(?:\.\d+)?)/g);
    if (price && price.length >= 2) {
      var vals = price.map(function(x){ return parseFloat(x.replace(/[^\d.]/g, '')); });
      var pctVal = vals.find(function(v){ return v < 100; });
      var priceVal = vals.find(function(v){ return v >= 100; });
      if (pctVal && priceVal) return {id: 'disc', prefill: {p: priceVal, o: pctVal}};
    }
    return {id: 'disc', prefill: {o: parseFloat(m[1])}};
  }
  // Currency
  if (/convert|exchange|to usd|to eur|to gbp|usd to|eur to|gbp to/i.test(q)) {
    var curMatch = q.match(/(\d+(?:\.\d+)?)/);
    var prefill = {};
    if (curMatch) prefill.n = parseFloat(curMatch[1]);
    return {id: 'pct', prefill: prefill}; // route to a placeholder that still works
  }
  if (/sales?\s*tax|vat|gst/i.test(q)) return {id: 'stax'};
  if (/(per hour|hourly|salary|wage)/i.test(q)) {
    var hm = q.match(/\$?\s*(\d+(?:\.\d+)?)/);
    return {id: 'h2s', prefill: hm ? {h: parseFloat(hm[1])} : {}};
  }
  if (/(loan|mortgage|payment)/i.test(q)) return {id: 'loan'};
  if (/tip/i.test(q)) return {id: 'tip'};
  if (/\bbmi\b|body\s*mass/i.test(q)) return {id: 'bmi'};
  if (/(percent|%)/i.test(q)) return {id: 'pct'};
  if (/fahrenheit|celsius|°f|°c/i.test(q)) return {id: 'temp'};
  if (/convert|exchange/i.test(q)) return {id: 'len'};
  // Fallback: keyword match
  var words = q.split(/\s+/);
  var best = null, bestScore = 0;
  TL.forEach(function(t){
    var text = (t.name + ' ' + t.cat + ' ' + (t.desc || '')).toLowerCase();
    var score = 0;
    words.forEach(function(w){ if (w.length > 2 && text.indexOf(w) !== -1) score++; });
    if (score > bestScore) { bestScore = score; best = t; }
  });
  return best ? {id: best.id} : null;
}

function parseField(spec){
  var parts = spec.split('|');
  var k = parts[0], l = parts[1], d = parts[2] == null ? '' : parts[2];
  var ty = 'number', neg = 0, o = null;
  var m = k.match(/^(n|d|t|x|s|dt|m):(.+)$/);
  if (m) { ty = {n:'number', d:'date', t:'time', x:'textarea', s:'select', dt:'datetime-local', m:'month'}[m[1]]; neg = m[1] === 'n'; k = m[2]; }
  if (ty === 'select') { o = d.split(','); d = o[0]; }
  if (ty === 'textarea') d = d.replace(/;/g, '\n');
  if (d.charAt(0) === '@') {
    var nm = d.match(/[+-]\d+/);
    var n = nm ? +nm[0] : 0;
    var x = new Date(Date.now() + n*864e5);
    var s2 = x.toISOString().slice(0, 10);
    d = ty === 'month' ? s2.slice(0, 7) : (ty === 'datetime-local' ? s2 + 'T09:00' : s2);
  }
  return {k: k, l: l, ty: ty, d: d, o: o, neg: neg};
}

        if (!isFinite(x)) err = err || 'Enter a valid number for "' + s.l + '".';
        else if (x < 0 && !s.neg) err = err || '"' + s.l + '" cannot be negative.';
      } else if (s.ty === 'textarea') {
        x = raw.trim() === '' ? s.d : raw;
      } else {
        x = raw === '' ? s.d : raw;
      }
      v[s.k] = x;
    });
    var r = err;
    if (!r) {
      try { r = tl.fn(v); }
      catch(e){ r = 'These inputs cannot be calculated.'; }
    }
    if (typeof r !== 'string' && r && r.some(function(a){ return /NaN|Infinity|undefined|∞/.test(String(a[1])); })) {
      r = 'Check for zeros or unrealistic values.';
    }
    lastResult = null;
    res.innerHTML = '';
    if (typeof r === 'string') {
      res.appendChild(h('div', {class: 'err'}, r));
      return;
    }
    if (!r || !r.length) {
      res.appendChild(h('div', {class: 'err'}, 'No result.'));
      return;
    }
    lastResult = r;

    var rb = h('div', {class: 'result-box'});

    var mainVal = String(r[0][1]).match(/-?[\d,]+(\.\d+)?/);

      breakdown.appendChild(h('div', {class: cls}, [h('span', {}, a[0]), h('b', {}, String(a[1]))]));
    });
    rb.appendChild(breakdown);

    // Explain
    if (r.length >= 2) {
      var explain = h('div', {class: 'explain'});
      explain.appendChild(h('h4', {}, 'How we calculated it'));
      var mathLines = [];
      r.forEach(function(a){ mathLines.push(a[0] + ' = ' + a[1]); });
      explain.appendChild(h('div', {class: 'math'}, mathLines.join('\n')));
      res.appendChild(rb);
      res.appendChild(explain);
    } else {
      res.appendChild(rb);
    }

    // Actions
    var resText = tl.name + '\n' + r.map(function(a){ return a[0] + ': ' + a[1]; }).join('\n') + '\n\nvia DealPilot';
    var acts = h('div', {class: 'acts'}, [
      h('button', {class: 'btn', onclick: function(){ copyToClipboard(resText, 'Result copied'); }}, '📋 Copy result'),
      h('button', {class: 'btn ghost', onclick: function(){ shareResult(resText); }}, '📤 Share'),
      h('button', {class: 'btn ghost', onclick: function(){
        sp.forEach(function(s){
          if (s.ty === 'select') ins[s.k].value = s.d;
          else ins[s.k].value = '';
        });
        run();
      }}, '↺ Calculate again')
    ]);
    res.appendChild(acts);
  }
  sp.forEach(function(s){ ins[s.k].oninput = run; });

  box.appendChild(form);
  box.appendChild(res);
  container.appendChild(box);

  // Related
  if (tl.related) {
    var relGrid = h('div', {class: 'grid'});
    tl.related.map(getById).filter(Boolean).forEach(function(t){ relGrid.appendChild(makeToolCard(t)); });
    container.appendChild(h('div', {class: 'related'}, [h('h3', {}, 'You may also need'), relGrid]));

  }

  app.innerHTML = '';
  app.appendChild(container);
  run();
}

];
function fetchCoinPrice(id){ return fetch('https://api.coingecko.com/api/v3/simple/price?ids=' + id + '&vs_currencies=usd&include_24hr_change=true').then(function(r){ return r.json(); }).then(function(d){ if (!d[id]) throw 0; return {price: d[id].usd, change24h: d[id].usd_24h_change}; }).catch(function(){ return null; }); }
function fetchCoinHistory(id){ return fetch('https://api.coingecko.com/api/v3/coins/' + id + '/market_chart?vs_currency=usd&days=2').then(function(r){ return r.json(); }).then(function(d){ return d.prices ? d.prices.map(function(p){ return p[1]; }) : null; }).catch(function(){ return null; }); }
function calcRSI(closes, period){ period = period || 14; if (closes.length < period + 1) return null; var gains = 0, losses = 0; for (var i = 1; i <= period; i++) { var diff = closes[i] - closes[i-1]; if (diff >= 0) gains += diff; else losses -= diff; } var avgGain = gains / period, avgLoss = losses / period; for (var j = period + 1; j < closes.length; j++) { var d = closes[j] - closes[j-1]; avgGain = (avgGain * (period - 1) + (d > 0 ? d : 0)) / period; avgLoss = (avgLoss * (period - 1) + (d < 0 ? -d : 0)) / period; } if (avgLoss === 0) return 100; return 100 - (100 / (1 + avgGain / avgLoss)); }
function calcSMA(closes, period){ period = period || 20; if (closes.length < period) return null; var sum = 0; for (var i = closes.length - period; i < closes.length; i++) sum += closes[i]; return sum / period; }
function predictMarket(closes){
  if (!closes || closes.length < 20) return {signal:'WAIT', confidence:50, reasons:['Loading data...']};
  var price = closes[closes.length - 1];
  var rsi = calcRSI(closes, 14), sma = calcSMA(closes, 20);
  var signal = 'WAIT', confidence = 50, reasons = [], momentum = 0;
  if (closes.length >= 6) { var recent = closes.slice(-6); momentum = (recent[recent.length-1] - recent[0]) / recent[0] * 100; }
  if (rsi !== null && sma !== null) {
    if (rsi < 30 && price < sma) { signal = 'UP'; confidence = 70 + Math.min(25, 30 - rsi); reasons.push('Oversold — RSI at ' + rsi.toFixed(1)); reasons.push('Price below 20-period average'); }
    else if (rsi > 70 && price > sma) { signal = 'DOWN'; confidence = 70 + Math.min(25, rsi - 70); reasons.push('Overbought — RSI at ' + rsi.toFixed(1)); reasons.push('Price above 20-period average'); }
    else if (rsi < 40) { signal = 'UP'; confidence = 55 + (40 - rsi); reasons.push('RSI leaning oversold'); }
    else if (rsi > 60) { signal = 'DOWN'; confidence = 55 + (rsi - 60); reasons.push('RSI leaning overbought'); }
    else if (momentum > 0.5) { signal = 'UP'; confidence = 58 + Math.min(20, momentum); reasons.push('Upward momentum +' + momentum.toFixed(2) + '%'); }
    else if (momentum < -0.5) { signal = 'DOWN'; confidence = 58 + Math.min(20, -momentum); reasons.push('Downward momentum ' + momentum.toFixed(2) + '%'); }
    else { signal = 'WAIT'; confidence = 50; reasons.push('No strong signal right now'); }
  }
  return {signal: signal, confidence: Math.min(95, Math.round(confidence)), rsi: rsi, sma: sma, price: price, momentum: momentum, reasons: reasons};
}

function renderGame2048(){
  resetSEO(); document.title = '2048 — ' + SITE_NAME;
  var size = 4, grid, score, best = S.g('game_2048_best', 0), over;
  function init(){
    grid = [];
    for (var i = 0; i < size; i++) { grid.push([]); for (var j = 0; j < size; j++) grid[i].push(0); }
    score = 0; over = false; addRandom(); addRandom();
  }
  function addRandom(){
    var empty = [];
    for (var i = 0; i < size; i++) for (var j = 0; j < size; j++) if (grid[i][j] === 0) empty.push([i,j]);
    if (!empty.length) return;
    var cell = empty[Math.floor(Math.random()*empty.length)];
    grid[cell[0]][cell[1]] = Math.random() < 0.9 ? 2 : 4;
  }
  function slide(row){
    var arr = row.filter(function(x){ return x; });
    var res = [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] === arr[i+1]) { res.push(arr[i]*2); score += arr[i]*2; i++; }
      else res.push(arr[i]);
    }
    while (res.length < size) res.push(0);
    return res;
  }
  function move(dir){
    if (over) return;
    var before = JSON.stringify(grid);
    if (dir === 'left') { for (var i = 0; i < size; i++) grid[i] = slide(grid[i]); }
    else if (dir === 'right') { for (var i = 0; i < size; i++) grid[i] = slide(grid[i].slice().reverse()).reverse(); }
    else if (dir === 'up') { for (var j = 0; j < size; j++) { var col = []; for (var i = 0; i < size; i++) col.push(grid[i][j]); col = slide(col); for (var i2 = 0; i2 < size; i2++) grid[i2][j] = col[i2]; } }
    else if (dir === 'down') { for (var j2 = 0; j2 < size; j2++) { var col2 = []; for (var i3 = 0; i3 < size; i3++) col2.push(grid[i3][j2]); col2 = slide(col2.reverse()).reverse(); for (var i4 = 0; i4 < size; i4++) grid[i4][j2] = col2[i4]; } }
    if (JSON.stringify(grid) !== before) { addRandom(); render(); }
    if (score > best) { best = score; S.s('game_2048_best', best); }
    if (isGameOver()) { over = true; showGameOver(); }
  }
  function isGameOver(){
    for (var i = 0; i < size; i++) for (var j = 0; j < size; j++) {
      if (grid[i][j] === 0) return false;
      if (j < size - 1 && grid[i][j] === grid[i][j+1]) return false;
      if (i < size - 1 && grid[i][j] === grid[i+1][j]) return false;
    }
    return true;
  }
  var scoreEl = h('div', {class: 'score'}, 'Score: 0');
  var header = h('div', {class: 'game-head'}, [h('h3', {}, '2048'), scoreEl]);
  var boardGrid = h('div', {class: 'grid-2048'});
  var content = h('div', {}, [boardGrid,
    h('div', {class: 'gpad'}, [
      h('button', {class: 'up', 'aria-label': 'Up', onclick: function(){ move('up'); }}, '▲'),
      h('button', {class: 'left', 'aria-label': 'Left', onclick: function(){ move('left'); }}, '◀'),
      h('button', {class: 'down', 'aria-label': 'Down', onclick: function(){ move('down'); }}, '▼'),
      h('button', {class: 'right', 'aria-label': 'Right', onclick: function(){ move('right'); }}, '▶')
    ]),
    h('div', {class: 'acts', style: 'justify-content:center'}, [h('button', {class: 'btn ghost', onclick: function(){ init(); render(); }}, '🔄 New game')])
  ]);
  gameWrap('🔢 2048', header, content);
  document.addEventListener('keydown', function(e){
    if (location.hash.indexOf('/games/2048') !== 0) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); move('left'); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); move('right'); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move('up'); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); move('down'); }
  });
  function render(){
    scoreEl.textContent = 'Score: ' + score + ' · Best: ' + best;
    boardGrid.innerHTML = '';
    for (var i = 0; i < size; i++) for (var j = 0; j < size; j++) {
      var v = grid[i][j];
      boardGrid.appendChild(h('div', {class: 'tile-2048 ' + (v ? 't' + v : '')}, v || ''));
    }
  }
  function showGameOver(){
    var overlay = h('div', {class: 'game-overlay'}, h('div', {class: 'game-overlay-inner'}, [
      h('h2', {}, 'Game over'),
      h('div', {class: 'game-stats'}, [
        h('div', {class: 'game-stat'}, [h('div', {class: 'v'}, String(score)), h('div', {class: 'l'}, 'Score')]),
        h('div', {class: 'game-stat'}, [h('div', {class: 'v'}, String(best)), h('div', {class: 'l'}, 'Best')])
      ]),
      h('div', {class: 'acts', style: 'justify-content:center'}, [
        h('button', {class: 'btn accent', onclick: function(){ overlay.remove(); init(); render(); }}, 'Play again'),
        h('a', {href: '#/games', class: 'btn ghost'}, 'Back')
      ])
    ]));
    document.body.appendChild(overlay);
  }
  init(); render();
}
function renderTTT(){
  resetSEO(); document.title = 'Tic Tac Toe — ' + SITE_NAME;
  var board = ['','','','','','','','',''];
  var gameOver = false;
  var scores = S.g('game_ttt', {w:0, l:0, d:0});
  var scoreEl = h('div', {class: 'score'}, 'You ' + scores.w + ' · AI ' + scores.l + ' · D ' + scores.d);
  var header = h('div', {class: 'game-head'}, [h('h3', {}, 'Tic Tac Toe'), scoreEl]);
  var grid = h('div', {class: 'ttt-grid'});
  var cells = [];
  for (var i = 0; i < 9; i++) (function(idx){
    var c = h('div', {class: 'ttt-cell', onclick: function(){ play(idx); }});
    cells.push(c); grid.appendChild(c);
  })(i);
  var status = h('p', {style: 'text-align:center;color:var(--text2);margin-top:16px;font-weight:600'}, 'Your turn (X)');
  var content = h('div', {}, [grid, status, h('div', {class: 'acts', style: 'justify-content:center'}, [h('button', {class: 'btn ghost', onclick: reset}, '🔄 New game')])]);
  gameWrap('⭕ Tic Tac Toe', header, content);
  function play(idx){
    if (gameOver || board[idx] !== '') return;
    board[idx] = 'X'; cells[idx].textContent = 'X'; cells[idx].classList.add('x');
    if (checkWin('X')) return finish('win');
    if (board.every(function(c){ return c; })) return finish('draw');
    status.textContent = 'AI thinking...';
    setTimeout(aiMove, 400);
  }
  function aiMove(){
    if (gameOver) return;
    var best = bestMove();
    board[best] = 'O'; cells[best].textContent = 'O'; cells[best].classList.add('o');
    if (checkWin('O')) return finish('lose');
    if (board.every(function(c){ return c; })) return finish('draw');
    status.textContent = 'Your turn (X)';
  }
  function bestMove(){ var b = minimax(board, 'O').index; if (b == null) { for (var i = 0; i < 9; i++) if (board[i] === '') return i; } return b; }
  function minimax(nb, p){
    var avail = [];
    for (var i = 0; i < 9; i++) if (nb[i] === '') avail.push(i);
    if (checkWin2(nb, 'X')) return {score: -10};
    if (checkWin2(nb, 'O')) return {score: 10};
    if (!avail.length) return {score: 0};
    var moves = [];
    for (var k = 0; k < avail.length; k++) {
      var mv = {index: avail[k]};
      var copy = nb.slice(); copy[avail[k]] = p;
      mv.score = minimax(copy, p === 'O' ? 'X' : 'O').score;
      moves.push(mv);
    }
    var bestMove, bestScore = p === 'O' ? -Infinity : Infinity;
    for (var m = 0; m < moves.length; m++) {
      if (p === 'O' ? moves[m].score > bestScore : moves[m].score < bestScore) { bestScore = moves[m].score; bestMove = m; }
    }
    return moves[bestMove];
  }
  function checkWin(p){ return checkWin2(board, p); }
  function checkWin2(b, p){ var lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return lines.some(function(l){ return b[l[0]] === p && b[l[1]] === p && b[l[2]] === p; }); }
  function finish(result){
    gameOver = true;
    if (result === 'win') { scores.w++; status.textContent = '🎉 You win!'; }
    else if (result === 'lose') { scores.l++; status.textContent = '😔 AI wins!'; }
    else { scores.d++; status.textContent = '🤝 Draw!'; }
    S.s('game_ttt', scores);
    scoreEl.textContent = 'You ' + scores.w + ' · AI ' + scores.l + ' · D ' + scores.d;
  }
  function reset(){
    board = ['','','','','','','','','']; gameOver = false;
    cells.forEach(function(c){ c.textContent = ''; c.className = 'ttt-cell'; });
    status.textContent = 'Your turn (X)';
  }
}

  var score = 0, timeLeft = 30, timerId = null, moleTimer = null, activeHole = -1;
  var best = S.g('game_mole_best', 0);
  var scoreEl = h('div', {class: 'score'}, 'Score 0 · 30s');
  var header = h('div', {class: 'game-head'}, [h('h3', {}, 'Whack-a-Mole'), scoreEl]);
  var grid = h('div', {class: 'mole-grid'});
  var holes = [];
  for (var i = 0; i < 9; i++) (function(idx){
    var hole = h('div', {class: 'mole-hole'}, [h('div', {class: 'mole'}, '🐹')]);
    hole.onclick = function(){
      if (idx === activeHole) { score++; hole.classList.remove('active'); activeHole = -1; updateHUD(); }
    };
    holes.push(hole); grid.appendChild(hole);
  })(i);
  var content = h('div', {}, [grid, h('div', {class: 'acts', style: 'justify-content:center;margin-top:20px'}, [h('button', {class: 'btn ghost', onclick: startGame}, '🔄 New game')])]);
  gameWrap('🔨 Whack-a-Mole', header, content);
  function updateHUD(){ scoreEl.textContent = 'Score ' + score + ' · ' + timeLeft + 's'; }
  function spawnMole(){
    if (timerId === null) return;
    if (activeHole >= 0 && holes[activeHole]) holes[activeHole].classList.remove('active');
    var idx = Math.floor(Math.random() * 9);
    activeHole = idx;
    holes[idx].classList.add('active');
    var dur = Math.max(500, 1200 - score * 20);
    setTimeout(function(){ if (activeHole === idx) { holes[idx].classList.remove('active'); activeHole = -1; } }, dur);
  }
  function startGame(){
    score = 0; timeLeft = 30;
    if (timerId) clearInterval(timerId);
    if (moleTimer) clearInterval(moleTimer);
    holes.forEach(function(h){ h.classList.remove('active'); });
    activeHole = -1; updateHUD();
    timerId = setInterval(function(){ timeLeft--; updateHUD(); if (timeLeft <= 0) endGame(); }, 1000);
    moleTimer = setInterval(spawnMole, 900);
    spawnMole();
  }
  function endGame(){
    clearInterval(timerId); clearInterval(moleTimer);
    timerId = null; moleTimer = null;
    if (score > best) { best = score; S.s('game_mole_best', best); }
    var overlay = h('div', {class: 'game-overlay'}, h('div', {class: 'game-overlay-inner'}, [
      h('h2', {}, '⏰ Time up!'),
      h('div', {class: 'game-stats'}, [
        h('div', {class: 'game-stat'}, [h('div', {class: 'v'}, String(score)), h('div', {class: 'l'}, 'Score')]),
        h('div', {class: 'game-stat'}, [h('div', {class: 'v'}, String(best)), h('div', {class: 'l'}, 'Best')])
      ]),
      h('div', {class: 'acts', style: 'justify-content:center'}, [
        h('button', {class: 'btn accent', onclick: function(){ overlay.remove(); startGame(); }}, 'Play again'),
        h('a', {href: '#/games', class: 'btn ghost'}, 'Back')
      ])
    ]));
    document.body.appendChild(overlay);
  }
  startGame();
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(){
  var x = S.g('theme', 'auto');
  var r = document.documentElement;
  if (x === 'auto') {
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    r.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  } else {
    r.setAttribute('data-theme', x === 'dark' ? 'dark' : 'light');
  }
  var b = $('#thBtn');
  if (b) b.textContent = x === 'dark' ? '☀' : (x === 'light' ? '☾' : '◐');
}
$('#thBtn').onclick = function(){
  var order = ['auto', 'light', 'dark'];
  var cur = S.g('theme', 'auto');
  var next = order[(order.indexOf(cur) + 1) % 3];
  S.s('theme', next);
  applyTheme();
  showToast('Theme: ' + next);
};

/* ============================================================
   REGION / LANGUAGE SELECTORS
   ============================================================ */
function initSelectors(){
  var regionSel = $('#regionSel');
  regionSel.innerHTML = '';
  Object.keys(REGIONS).forEach(function(k){
    var o = document.createElement('option');
    o.value = k;
    o.textContent = REGIONS[k].flag + ' ' + REGIONS[k].name;
    regionSel.appendChild(o);
  });
  regionSel.value = REGION;
  regionSel.onchange = function(e){ REGION = e.target.value; S.s('region', REGION); showToast('Region: ' + REGIONS[REGION].name); };

  var langSel = $('#langSel');
  langSel.innerHTML = '';
  LANGUAGES.forEach(function(l){
    var o = document.createElement('option');
    o.value = l.code;
    o.textContent = l.flag + ' ' + l.name;
    langSel.appendChild(o);
  });
  langSel.value = LANG;
  langSel.onchange = function(e){ LANG = e.target.value; S.s('lang', LANG); document.documentElement.lang = LANG; };
}

/* ============================================================
   FOOTER
   ============================================================ */
function renderFooter(){
  var cols = [
    {title: 'Tools', links: [
      {t: 'All Tools', h: '#/all'},
      {t: 'Money', h: '#/money'},
      {t: 'Shopping', h: '#/shopping'},
      {t: 'Finance', h: '#/finance'},
      {t: 'Converters', h: '#/convert'}
    ]},
    {title: 'Popular', links: [
      {t: 'Discount Calculator', h: '#/t/disc'},
      {t: 'Sales Tax Calculator', h: '#/t/stax'},
      {t: 'Loan Calculator', h: '#/t/loan'},
      {t: 'Tip Calculator', h: '#/t/tip'},
      {t: 'BMI Calculator', h: '#/t/bmi'}
    ]},
    {title: 'More', links: [
      {t: 'Live Info', h: '#/live'},
      {t: 'US News', h: '#/news'},
      {t: 'Crypto Signals', h: '#/predict'},
      {t: 'Games', h: '#/games'},
      {t: 'Saved', h: '#/me'}
    ]}
  ];
  var wrap = document.getElementById('footerCols');
  if (!wrap) return;
  wrap.innerHTML = '';
  cols.forEach(function(c){
    var col = h('div', {class: 'footer-col'}, [h('h4', {}, c.title)]);
    c.links.forEach(function(l){ col.appendChild(h('a', {href: l.h}, l.t)); });
    wrap.appendChild(col);
  });
}

/* ============================================================
   NAV
   ============================================================ */
function navActive(path){
  var nav = document.querySelectorAll('.nav a');
  for (var i = 0; i < nav.length; i++) {
    var a = nav[i];
    var k = a.getAttribute('data-nav');
    var isOn = (k === path) ||
      (path.indexOf('/t/') === 0 && k === '/all') ||
      (path.indexOf('/games/') === 0 && k === '/games');
    a.classList.toggle('on', isOn);
  }
}

/* ============================================================
   ROUTER
   ============================================================ */
function route(){
  var hash = location.hash.slice(1);
  var qIdx = hash.indexOf('?');
  var p = qIdx === -1 ? hash : hash.slice(0, qIdx);
  var qs = qIdx === -1 ? '' : hash.slice(qIdx + 1);
  var P = new URLSearchParams(qs);
  window.scrollTo(0, 0);
  if (!p || p === '/') { renderHome(); navActive('/'); }
  else if (p === '/all') { renderAllTools(P); navActive('/all'); }
  else if (p === '/money') { renderCategory(M); navActive('/money'); }
  else if (p === '/shopping') { renderCategory(SH); navActive('/shopping'); }
  else if (p === '/finance') { renderCategory(FN); navActive('/finance'); }
  else if (p === '/convert') { renderCategory(CO); navActive('/convert'); }
  else if (p === '/live') { renderLive(); navActive('/live'); }
  else if (p === '/news') { renderNews(); navActive('/news'); }
  else if (p === '/me') { renderSaved(); navActive('/me'); }
  else if (p === '/predict') { renderPredict(); }
  else if (p === '/games') { renderGames(); }
  else if (p.indexOf('/games/') === 0) { renderGameById(p.slice(7)); }
  else if (p.indexOf('/t/') === 0) {
    var tl = getById(p.slice(3));
    if (tl) {
      var params = {};
      P.forEach(function(v, k){ params[k] = v; });
      renderToolPage(tl, params);
      navActive('/t/' + tl.id);
    } else {
      renderAllTools(P);
    }
  } else { renderHome(); navActive('/'); }
  setTimeout(function(){ if (window.monetagRefresh) window.monetagRefresh(); }, 400);
}

/* ============================================================
   INIT
   ============================================================ */
$('#yr').textContent = new Date().getFullYear();
applyTheme();
initSelectors();
renderFooter();
route();
window.addEventListener('hashchange', route);

// Watch system theme changes
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
    if (S.g('theme', 'auto') === 'auto') applyTheme();
  });
}

})();
</script>
