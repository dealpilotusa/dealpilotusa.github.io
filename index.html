function makeDebtFn(sortFn){
  return function(v){
    var R = parseLines(v.l).map(function(a){ return {n: a[0], b: +a[1], r: +a[2]/1200, m: +a[3], o: 0}; });
    if (!R.length || R.some(function(d){ return !(d.b > 0) || !(d.r >= 0) || !(d.m > 0); })) return 'Each line needs: name,balance,APR %,min payment.';
    var bud = R.reduce(function(s, d){ return s + d.m; }, 0) + v.x;
    var mo = 0, int = 0;
    while (R.some(function(d){ return d.b > 0.005; }) && mo < 1200) {
      mo++;
      R.forEach(function(d){ if (d.b > 0) { var i = d.b*d.r; d.b += i; int += i; } });
      var rem = bud;
      R.forEach(function(d){ if (d.b > 0) { var p = Math.min(d.m, d.b); d.b -= p; rem -= p; } });
      R.filter(function(d){ return d.b > 0.005; }).sort(sortFn).forEach(function(d){ var p = Math.min(rem, d.b); d.b -= p; rem -= p; });
      R.forEach(function(d){ if (d.b <= 0.005 && !d.o) d.o = mo; });
    }
    if (mo >= 1200 && R.some(function(d){ return d.b > 0.005; })) return 'Payments never clear the debts.';
    var out = [['Debt-free in', Math.floor(mo/12) + ' yrs ' + mo%12 + ' mo', 1],['Total interest', usd(int)]];
    R.sort(function(a, b){ return a.o - b.o; }).forEach(function(d){ out.push(['Paid off: ' + d.n, 'Month ' + d.o]); });
    return out;
  };
}

function buildList(el, key, mode){
  var items = S.g(key, []);
  var inp = h('input', {type: 'text', placeholder: 'Add an item...', maxlength: '200'});
  var ex = null;
  if (mode === 'time') ex = h('input', {type: 'time'});
  else if (mode === 'day') { ex = h('select'); WD.forEach(function(d){ ex.appendChild(h('option', {}, d)); }); }
  var ul = h('ul', {class: 'li'});
  var cnt = h('p', {style: 'color:var(--text3);font-size:.85rem;margin:8px 0'});
  function save(){ S.s(key, items); }
  function draw(){
    ul.innerHTML = '';
    items.forEach(function(a, i){
      var li = h('li', {}, [
        h('input', {type: 'checkbox', checked: a.d ? 'checked' : null, onchange: function(e){ a.d = e.target.checked; save(); draw(); }}),
        h('span', {class: a.d ? 'done' : ''}, (a.x ? a.x + ' — ' : '') + a.t),
        h('button', {class: 'x-btn', onclick: function(){ items.splice(i, 1); save(); draw(); }}, '×')
      ]);
      ul.appendChild(li);
    });
    var open = items.filter(function(x){ return !x.d; }).length;
    var done = items.filter(function(x){ return x.d; }).length;
    cnt.textContent = items.length ? (open + ' open · ' + done + ' done') : 'Nothing here yet.';
  }
  function add(){
    var tt = inp.value.trim();
    if (!tt) return;
    items.push({t: tt, d: 0, x: ex ? ex.value : ''});
    if (ex) items.sort(function(a, b){ return (a.x || '') > (b.x || '') ? 1 : -1; });
    inp.value = '';
    save(); draw();
  }
  inp.onkeydown = function(e){ if (e.key === 'Enter') add(); };
  el.appendChild(h('div', {class: 'form'}, [h('label', {}, [h('span', {}, 'Item'), inp]), ex ? h('label', {}, [h('span', {}, mode === 'time' ? 'Time' : 'Day'), ex]) : null]));

  el.appendChild(cnt);

}

function buildCalc(sci){
  return function(el){
    var inp = h('input', {type: 'text', placeholder: sci ? 'Try: sqrt(16)+sin(pi/2)*2^3' : 'Try: 12*(3+4)/2', autocomplete: 'off'});
    var out = h('div', {class: 'big'}, '0');
    var hist = h('ul', {class: 'li'});
    function run(){
      var s = inp.value.trim();
      if (!s) return;
      var e = s.replace(/\^/g, '**').replace(/π|\bpi\b/gi, '(3.141592653589793)').replace(/×/g, '*').replace(/÷/g, '/');
      if (sci) e = e.replace(/\b(asin|acos|atan|sin|cos|tan|log|ln|sqrt|abs|exp|floor|ceil|round)\b/g, function(m){ return 'Math.' + (m === 'ln' ? 'log' : (m === 'log' ? 'log10' : m)); });
      var chk = e.replace(/Math\.\w+/g, '');
      if (!/^[\d+\-*/().%\s,e]*$/.test(chk) || /[a-df-z]/i.test(chk)) { out.textContent = 'Invalid'; return; }
      var r;
      try { r = Function('"use strict";return (' + e + ')')(); } catch(err){ r = NaN; }
      if (typeof r !== 'number' || !isFinite(r)) { out.textContent = 'Cannot calculate'; return; }
      out.textContent = fmt(r, 10);
      hist.insertBefore(h('li', {}, h('span', {}, s + ' = ' + fmt(r, 10))), hist.firstChild);
      while (hist.children.length > 8) hist.removeChild(hist.lastChild);
      inp.select();
    }
    inp.onkeydown = function(e){ if (e.key === 'Enter') run(); };
    var keys = ['7','8','9','/','(','4','5','6','*',')','1','2','3','-','^','0','.','%','+','='];
    if (sci) keys = keys.concat(['sqrt(','sin(','cos(','tan(','log(','ln(','pi','abs(','exp(','round(']);
    var pad = h('div', {class: 'pad'});
    keys.forEach(function(k){ pad.appendChild(h('button', {onclick: function(){ if (k === '=') run(); else { inp.value += k; inp.focus(); } }}, k)); });
    el.appendChild(inp); el.appendChild(out); el.appendChild(pad);
    el.appendChild(h('div', {class: 'acts'}, [h('button', {class: 'btn', onclick: run}, 'Calculate'), h('button', {class: 'btn ghost', onclick: function(){ inp.value = ''; out.textContent = '0'; hist.innerHTML = ''; }}, 'Reset')]));
    el.appendChild(hist);
  };
}

function apiNews(category){
  var url = 'https://news.heyitsmejosh.com/api/stories?view=latest&limit=40';
  return fetch(url).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(data){
    var list = data && (data.stories || data.latest || data.items || data.articles);
    if (!list || !list.length) throw 0;
    var mapped = list.map(function(item){
      var src = item.source || item.outlet || item.domain || 'News';
      var img = item.image || item.socialimage || item.thumbnail || '';
      if (img && img.indexOf('http') !== 0) img = '';
      return {title: item.title || item.headline || 'Untitled', link: item.url || item.link || '#', pubDate: item.ts ? new Date(item.ts).toISOString() : (item.pubDate || item.published || new Date().toISOString()), source: String(src).replace(/^www\./, ''), image: img, category: (item.category || '').toLowerCase()};
    });
    var filtered = mapped.filter(function(n){
      if (category === 'top') return true;
      var t = (n.title + ' ' + n.source).toLowerCase();
      var map = {nation: ['politic', 'elect', 'congress', 'white house', 'senate', 'biden', 'trump', 'us '], business: ['business', 'econom', 'market', 'stock', 'wall street', 'fed '], technology: ['tech', ' ai ', 'software', 'apple', 'google', 'microsoft', 'startup'], sports: ['nfl', 'nba', 'mlb', 'sport', 'game', 'team', 'player', 'coach'], entertainment: ['entertain', 'movie', 'music', 'hollywood', 'celebr', 'film'], health: ['health', 'medic', 'hospital', 'doctor', 'covid', 'wellness'], science: ['scien', 'research', 'nasa', 'space', 'study', 'discover']};
      var keys = map[category] || [];
      return keys.some(function(k){ return t.indexOf(k) !== -1; });
    });
    return filtered.length ? filtered : mapped;
  }).catch(function(){ return apiNewsFallback(category); });
}
function apiNewsFallback(category){

function readingTime(title){ var words = (title || '').split(/\s+/).length * 8; var mins = Math.max(1, Math.round(words / 220)); return mins + ' min read'; }
function relativeTime(iso){
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

function renderMe(){
  document.title = 'Saved Results & Settings | DealPilot USA';
  setCanonical(SITE_URL + '/#/me');
  var theme = S.g('theme', 'auto');
  var saved = S.g('saved', []);
  var sel = h('select', {onchange: function(e){ S.s('theme', e.target.value); applyTheme(); }});
  sel.appendChild(h('option', {value: 'auto'}, 'Match device'));
  sel.appendChild(h('option', {value: 'dark'}, 'Dark'));
  sel.appendChild(h('option', {value: 'light'}, 'Light'));
  sel.value = theme;
  function clearBtn(label, fn){ return h('button', {class: 'btn ghost', onclick: function(){ if (confirm(label + '?')) { fn(); route(); } }}, label); }
  app.innerHTML = '';
  app.appendChild(h('h1', {style: 'font-family:Manrope,sans-serif;font-weight:800;font-size:1.6rem;margin-bottom:16px'}, tr('saved') + ' & Settings'));
  app.appendChild(h('div', {class: 'card'}, [h('label', {}, [h('span', {}, 'Theme'), sel]), h('div', {class: 'acts'}, [clearBtn('Clear recent', function(){ S.d('recent'); S.d('uses'); }), clearBtn('Clear favorites', function(){ S.d('fav'); }), clearBtn('Clear saved results', function(){ S.d('saved'); }), clearBtn('Erase ALL data', function(){ S.keys('').forEach(function(k){ localStorage.removeItem(k); }); })])]));

function applyTheme(){
  var x = S.g('theme', 'auto');
  var r = document.documentElement;
  if (x === 'auto') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', x);
  var b = $('#thBtn');
  if (b) b.textContent = x === 'dark' ? '☀️' : (x === 'light' ? '🌙' : '🌓');
}
$('#thBtn').onclick = function(){
  var order = ['auto', 'dark', 'light'];
  var cur = S.g('theme', 'auto');
  var next = order[(order.indexOf(cur) + 1) % 3];
  S.s('theme', next);
  applyTheme();
};

function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  var nav = document.querySelectorAll('.nav a');
  if (nav.length >= 5) { nav[0].textContent = tr('home'); nav[1].textContent = tr('allTools'); nav[2].textContent = tr('liveData'); nav[3].textContent = 'News'; nav[4].textContent = tr('saved'); }
  var ftr = $('#ftr');
  if (ftr) ftr.textContent = tr('footer');

function navActive(path){
  var nav = document.querySelectorAll('.nav a');
  for (var i = 0; i < nav.length; i++) {
    var a = nav[i];
    var k = a.getAttribute('data-nav');
    var isOn = (k === path) || (path.indexOf('/t/') === 0 && k === '/all');
    a.classList.toggle('on', isOn);
  }

window.updateSEOForNews = updateSEOForNews;

function route(){
  var hash = location.hash.slice(1);
  var qIdx = hash.indexOf('?');
  var p = qIdx === -1 ? hash : hash.slice(0, qIdx);
  var qs = qIdx === -1 ? '' : hash.slice(qIdx + 1);
  var P = new URLSearchParams(qs);
  window.scrollTo(0, 0);
  if (!p || p === '/') { renderHome(); navActive('/'); }
  else if (p === '/all') { document.title = 'All Free Tools | DealPilot USA'; resetSEO(); renderAllTools(P); navActive('/all'); }
